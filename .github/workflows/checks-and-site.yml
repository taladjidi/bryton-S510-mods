# Every push: download stock R039 from Bryton and run tests/test_tools.py (every patch and the "recommended" preset,
# bad input refused, deploy to a fake drive, readback import, web builder (site/) == build.py).
# Pushes to main then publish the web builder to GitHub Pages, only if all of that passed.
name: checks and site
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/cache@v4
        with:
          path: firmware/R039
          key: firmware-${{ hashFiles('firmware/SHA256SUMS') }}
      - name: Stock firmware (from Bryton's server; build.py re-checks the hashes)
        run: '[ -f firmware/R039/img.bin ] || python3 tools/fetch_firmware.py'
      - name: Patch emulator (tools/patchsim.py)
        run: pip install unicorn==2.1.4
      - name: Tests (every patch, the preset, refusals, deploy to a fake drive, readback, web builder == build.py)
        run: python3 -W ignore::ResourceWarning tests/test_tools.py -v

  site:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }
    concurrency: { group: pages, cancel-in-progress: true }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (page + builder + patch files; no firmware)
        run: |
          mkdir -p _site/patches
          cp site/index.html site/builder.js _site/
          if [ -d site/img ]; then cp -r site/img _site/; fi
          cp patches/*.patch _site/patches/
          (cd patches && ls *.patch) | python3 -c "import json,sys; print(json.dumps(sys.stdin.read().split()))" > _site/patches/index.json
          # Stamp this deploy's commit on the files the page loads, so a browser never mixes a cached builder.js or
          # patch list from an older deploy with this page (Pages lets browsers cache them for 10 min).
          V="${GITHUB_SHA::12}"
          sed -i -e "s|'./builder.js'|'./builder.js?v=$V'|" -e "s|'patches/index.json'|'patches/index.json?v=$V'|" \
                 -e "s|'patches/' + f)|'patches/' + f + '?v=$V')|" _site/index.html
          test "$(grep -c "?v=$V" _site/index.html)" = 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
